      const gp = watchGathering(pc, opts);
      await pc.setLocalDescription(await pc.createAnswer());

  }

  /* ======================= sesiune de joc: lockstep cu gazdă autoritară ======================= */
  function mulberry(seed) {
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.getState = () => a; f.setState = v => { a = v >>> 0; };
    return f;
  }

  /**
   * lockstep(session, {seed, onMove(move,info), onState(state,info), validate(move,ctx), snapshot(), hash(), onChat(text,from), onError(err), timeout, history})
   * Gazda atribuie seq, validează și difuzează; oaspetele aplică mutările doar în ordinea seq (resincronizare la lipsuri/divergență).
   */
  function lockstep(session, o) {
    o = o || {};
    let sess = session, seq = 0, seed = o.seed != null ? o.seed >>> 0 : randSeed(), rng = mulberry(seed), started = false, stopped = false, cid = 0, helloTries = 0, helloTimer = 0;
    const isHost = () => sess.role === 'host', log = [], ahead = new Map(), pending = new Map(), offs = [];
    const AHEAD_MAX = 256;
    const keep = o.history || 500, stats = {resyncs: 0, rejected: 0, dupes: 0, applied: 0};
    const fail = (reason, extra) => { const e = Object.assign(new Error(reason), {code: reason}, extra || {}); if (o.onError) o.onError(e); return e; };
    const send = m => sess.send(m);
    const tryApply = (move, info) => {
      let r;
      try { r = o.onMove ? o.onMove(move, info) : undefined; } catch (e) { return {ok: false, reason: String(e && e.message || e)}; }
      if (r === false) return {ok: false, reason: 'rejected'};
      if (typeof r === 'string') return {ok: false, reason: r};
      return {ok: true};
    };
    function snapshotMsg() {
      const m = {t: 'sync', seq, seed, rng: rng.getState()};
      if (o.snapshot) m.state = o.snapshot();
      return m;
    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }
      if (o.onState) o.onState(st, {reason, seq, seed, rng: rng.getState()});
    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) {
        if (m.seq - seq > AHEAD_MAX || ahead.size >= AHEAD_MAX) { send({t: 'need', from: seq}); return; }   // plafon: un partener rău nu umple memoria
        ahead.set(m.seq, m); send({t: 'need', from: seq}); return;
      }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});
      if (!r.ok) return r;
      seq++; stats.applied++;
      log.push({seq, move, from}); if (log.length > keep) log.shift();
      const m = {t: 'move', seq, move, from}; if (cidv != null) m.cid = cidv; if (o.hash) m.h = o.hash();
      send(m);
      return {ok: true, seq};
    }
    function onMsg(m) {
      if (stopped || !m || typeof m.t !== 'string') return;
      if (isHost()) {
        if (m.t === 'hello') { send(snapshotMsg()); }
        else if (m.t === 'move') {
          const r = hostApply(m.move, 'guest', m.cid);
          if (!r.ok) { stats.rejected++; send({t: 'reject', cid: m.cid, reason: r.reason}); }
        } else if (m.t === 'need') {
          const from = Number.isInteger(m.from) ? m.from : -1;
          if (!m.force && log.length && log[0].seq <= from + 1 && from <= seq) send({t: 'moves', list: log.filter(e => e.seq > from)});
          else if (o.snapshot) { stats.resyncs++; send(Object.assign(snapshotMsg(), {resync: true})); }
          else send({t: 'fatal', reason: 'no-history'});
        } else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'guest');
        return;
      }
      if (m.t === 'sync') {                                    // oaspete
        if (!Number.isInteger(m.seq) || !Number.isInteger(m.seed) || m.seq < 0) return;
        if (!m.resync && started && m.seq === seq && m.seed === seed) return;     // idempotent
        if (m.state !== undefined || m.seq === 0) {            // stare completă sau început de joc
          const first = !started;
          seq = m.seq; seed = m.seed >>> 0; rng = mulberry(seed);
          if (Number.isInteger(m.rng)) rng.setState(m.rng);

        } else if (m.seq > seq) {                              // gazda e înainte, fără instantaneu: cere mutările
          if (!started) { seed = m.seed >>> 0; rng = mulberry(seed); started = true; clearTimeout(helloTimer); }
          send({t: 'need', from: seq});
        } else fail('diverged');
      } else if (m.t === 'move') { if (started && Number.isInteger(m.seq) && m.move && typeof m.move === 'object') applyRemote(m); }
      else if (m.t === 'moves' && Array.isArray(m.list)) { m.list.slice(0, keep).forEach(e => { if (e && Number.isInteger(e.seq) && e.move && typeof e.move === 'object') applyRemote({t: 'move', seq: e.seq, move: e.move, from: e.from === 'host' ? 'host' : 'guest'}); }); }
      else if (m.t === 'reject') { const p = pending.get(m.cid); if (p) { pending.delete(m.cid); clearTimeout(p.timer); p.reject(Object.assign(new Error(String(m.reason || 'rejected')), {code: 'rejected'})); } }
      else if (m.t === 'fatal') fail(String(m.reason || 'fatal'));
      else if (m.t === 'chat' && o.onChat && typeof m.text === 'string') o.onChat(m.text.slice(0, 2000), 'host');
    }
    function bind() {
      offs.forEach(f => f()); offs.length = 0;
      offs.push(sess.on('message', onMsg));
      offs.push(sess.on('open', start));
      offs.push(sess.on('close', () => { pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error('closed'), {code: 'closed'})); }); pending.clear(); }));
      if (sess.open) start();
    }
    function start() {
      if (isHost()) { if (!started) { started = true; begin('start'); } send(snapshotMsg()); }
      else { helloTries = 0; hello(); }
    }
    function hello() {
      clearTimeout(helloTimer);
      if (stopped) return;
      if (helloTries++ >= 8) { if (!started) fail('no-sync'); return; }
      send({t: 'hello', seq});
      helloTimer = setTimeout(() => { if (!started) hello(); }, 1500);
    }
    const api = {
      get seq() { return seq; }, get seed() { return seed; }, get role() { return sess.role; }, get stats() { return Object.assign({}, stats); },
      rng: () => rng(), get rngState() { return rng.getState(); },
      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */
      move(move) {
        if (stopped) return Promise.reject(Object.assign(new Error('stopped'), {code: 'stopped'}));
        if (isHost()) {
          const r = hostApply(move, 'host');
          return r.ok ? Promise.resolve({seq: r.seq, ok: true}) : Promise.reject(Object.assign(new Error(r.reason), {code: 'rejected'}));
        }
        if (!sess.open) return Promise.reject(Object.assign(new Error('closed'), {code: 'closed'}));
        const id = ++cid;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(Object.assign(new Error('timeout'), {code: 'timeout'})); }, o.timeout || 8000);
          pending.set(id, {resolve, reject, timer});
          if (!send({t: 'move', cid: id, move})) { clearTimeout(timer); pending.delete(id); reject(Object.assign(new Error('closed'), {code: 'closed'})); }
        });
      },
      chat(text) { return send({t: 'chat', text: String(text).slice(0, 2000)}); },
      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */
      resync() { if (isHost()) return send(snapshotMsg()); return send({t: 'need', from: seq, force: true}); },
      /** După o reconectare: leagă aceeași stare de joc la o sesiune nouă. */
      rebind(newSession) { sess = newSession; bind(); },
      stop() { stopped = true; clearTimeout(helloTimer); offs.forEach(f => f()); offs.length = 0; }
    };

  }

  /** QR (sau cadre QR succesive) pentru un cod; returnează {node, destroy}. */

    const draw = () => {
      let svgStr;

    };
    root.appendChild(box);

  function dialog(o) {

tt_span:"Working memory: backward digits",ti_span:"Memorize the digits shown one by one, then type them in REVERSE order.",

a_cov:"Measured here by:",a_no:"Not measured by this app.",a_best:"Most objective measurement",
a_iq_n:"IQ — general intelligence (g)",a_iq_d:"The general ability to reason, learn and solve novel problems; g accounts for about half the variance among cognitive tests.",a_iq_m:"Individual batteries (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) given by a psychologist with current norms; composite reliability ≈ .95–.98. Short online tests are far less precise.",
a_eq_n:"EQ — emotional intelligence",a_eq_d:"The ability to perceive, understand and regulate emotions (Mayer–Salovey ability model). Not the same as questionnaire “trait” EI.",a_eq_m:"MSCEIT (consensus/expert scoring) and emotion perception and understanding tasks. Questionnaires (EQ-i, TEIQue) capture self-image, only weakly (~.2) related to ability.",
a_cq_n:"CQ — creativity",a_cq_d:"The capacity to produce novel and useful ideas; divergent thinking is only one component.",a_cq_m:"Alternative Uses (AUT) or TTCT scored by independent raters (consensual assessment technique, Amabile) plus documented creative achievements. Originality cannot be scored objectively by a simple offline program.",
a_cu_n:"CQ — cultural intelligence",a_cu_d:"Effectiveness in culturally diverse settings (Ang & Van Dyne): metacognitive, cognitive, motivational, behavioural factors.",a_cu_m:"20-item CQS (self-report), the observer version and intercultural situational tests. No established performance test exists.",
a_sq_n:"SQ — social intelligence",a_sq_d:"Understanding people and acting appropriately in social situations.",a_sq_m:"Video-based situational tests with consensus scoring, plus observer ratings. Older instruments overlap heavily with verbal IQ.",
a_aq_n:"AQ — adversity quotient",a_aq_d:"How a person responds to hardship (Stoltz). The construct has weak psychometric support.",a_aq_m:"Prefer validated resilience scales (CD-RISC, BRS) and behavioural persistence tasks; the AQ Profile is mostly self-report.",
a_ef_n:"Self-control / executive functions",a_ef_d:"Inhibition, attentional control, delaying reward, deciding under risk.",a_ef_m:"Timed behavioural tasks (Stroop, Go/No-Go, delay discounting, BART) — exactly the kind used here; moderate reliability, so repeat them.",
a_mx_n:"MQ, spiritual SQ, DQ and other “quotients”",a_mx_d:"Moral, spiritual, digital, curiosity, love quotients… are mostly popular labels.",a_mx_m:"Most lack scientific consensus, norms or criterion validation; an online “score” has no diagnostic value. The app does not measure them, to avoid manufacturing false precision.",
m_h:"What “most objective” means",
m_1:"Performance, not opinion. Self-report is the least objective; the app uses only tasks with verifiable answers or measured behaviour.",
m_2:"Computed keys, not subjective ones. Items are generated procedurally and the correct answer follows from a rule; forms are parallel.",
m_3:"Standardized conditions: fixed time, identical instructions, no aids, large screen, quiet place, well rested.",
m_4:"Measurement error. Every score has a standard error; a composite of several tests reduces it, and the 95% confidence interval is shown.",
m_5:"Repetition. One score is noise: retake tests on different days and interpret the average.",
m_6:"Norms. Without a representative sample there is no real IQ. Norms here are estimated and PROVISIONAL; the interval includes normative uncertainty (±0.3 SD).",
m_7:"Validity. The score tells what you did on these tasks, not your worth. For educational, clinical or career decisions, seek a standardized psychological assessment.",
m_lim:"Limits: self-administration, variable latency and device, practice, fatigue, no cheating detection. A valid clinical IQ requires a qualified examiner.",
i_text:"Offline app, no tracking. Results stay on this device only. Code under the MIT licence.",f_tf:"Trade-free · offline · no tracking"
},

a_cov:"Mesuré ici par :",a_no:"Non mesuré par cette application.",a_best:"Mesure la plus objective",
a_iq_n:"QI — intelligence générale (g)",a_iq_d:"Capacité générale de raisonner, d'apprendre et de résoudre des problèmes nouveaux ; g explique environ la moitié de la variance entre tests cognitifs.",a_iq_m:"Batteries individuelles (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) passées avec un psychologue, normes actuelles ; fidélité composite ≈ ,95–,98. Les tests courts en ligne sont bien moins précis.",
a_eq_n:"QE — intelligence émotionnelle",a_eq_d:"Aptitude à percevoir, comprendre et réguler les émotions (modèle d'aptitude de Mayer–Salovey). À ne pas confondre avec l'IE « trait » des questionnaires.",a_eq_m:"MSCEIT (notation par consensus/experts) et tâches de perception et de compréhension des émotions. Les questionnaires (EQ-i, TEIQue) mesurent l'image de soi, faiblement liée (~,2) à l'aptitude.",
a_cq_n:"QC — créativité",a_cq_d:"Capacité de produire des idées nouvelles et utiles ; la pensée divergente n'en est qu'une composante.",a_cq_m:"Usages alternatifs (AUT) ou TTCT notés par des évaluateurs indépendants (technique d'évaluation consensuelle, Amabile) + réalisations créatives documentées. L'originalité ne peut pas être notée objectivement par un simple programme hors ligne.",
a_cu_n:"QC — intelligence culturelle",a_cu_d:"Efficacité dans des contextes culturels variés (Ang & Van Dyne) : facteurs métacognitif, cognitif, motivationnel, comportemental.",a_cu_m:"CQS à 20 items (auto-évaluation), version pour observateurs et tests situationnels interculturels. Aucun test de performance établi.",
a_sq_n:"QS — intelligence sociale",a_sq_d:"Comprendre les gens et agir de façon adaptée en situation sociale.",a_sq_m:"Tests situationnels vidéo à notation consensuelle, plus évaluations d'observateurs. Les anciens outils recoupent fortement le QI verbal.",
a_aq_n:"QA — quotient d'adversité",a_aq_d:"Manière de réagir aux difficultés (Stoltz). Le concept est faiblement étayé psychométriquement.",a_aq_m:"Préférer des échelles de résilience validées (CD-RISC, BRS) et des tâches comportementales de persévérance ; l'AQ Profile est surtout de l'auto-évaluation.",
a_ef_n:"Maîtrise de soi / fonctions exécutives",a_ef_d:"Inhibition, contrôle attentionnel, report de récompense, décision sous risque.",a_ef_m:"Tâches comportementales chronométrées (Stroop, Go/No-Go, actualisation différée, BART) — exactement le type utilisé ici ; fidélité modérée, donc à répéter.",
a_mx_n:"QM, QS spirituel, QN et autres « quotients »",a_mx_d:"Quotients moral, spirituel, numérique, de curiosité, d'amour… sont surtout des étiquettes populaires.",a_mx_m:"La plupart n'ont ni consensus scientifique, ni normes, ni validation de critère ; un « score » en ligne n'a aucune valeur diagnostique. L'application ne les mesure pas, pour ne pas fabriquer une fausse précision.",
m_h:"Ce que veut dire « le plus objectif »",
m_1:"Performance, pas opinion. L'auto-évaluation est la moins objective ; l'application n'utilise que des tâches à réponse vérifiable ou un comportement mesuré.",
m_2:"Clés calculées, non subjectives. Les items sont générés par procédure et la bonne réponse découle d'une règle ; les formes sont parallèles.",
m_3:"Conditions standardisées : temps fixe, consignes identiques, aucune aide, grand écran, lieu calme, bien reposé.",
m_4:"Erreur de mesure. Tout score a une erreur standard ; un composite de plusieurs tests la réduit, et l'intervalle de confiance à 95 % est affiché.",
m_5:"Répétition. Un seul score est du bruit : refaites les tests à des jours différents et interprétez la moyenne.",
m_6:"Normes. Sans échantillon représentatif, pas de vrai QI. Les normes ici sont estimées et PROVISOIRES ; l'intervalle inclut l'incertitude normative (±0,3 ET).",
m_7:"Validité. Le score dit ce que vous avez fait dans ces tâches, pas votre valeur. Pour une décision scolaire, clinique ou professionnelle, demandez un bilan psychologique standardisé.",
m_lim:"Limites : auto-administration, latence et appareil variables, pratique, fatigue, pas de détection de la triche. Un QI clinique valide exige un examinateur qualifié.",
i_text:"Application hors ligne, sans traçage. Les résultats restent sur cet appareil. Code sous licence MIT.",f_tf:"Trade-free · hors ligne · sans traçage"
},

tier1:"Livello 1 · test di prestazione standardizzato e normato, somministrato da uno specialista",tier2:"Livello 2 · test di prestazione con punteggio per consenso o valutatori indipendenti",tier3:"Livello 3 · compito comportamentale o valutazione di osservatori",tier4:"Livello 4 · autovalutazione (la meno oggettiva)",t_app:"Qui: livello 3 — compiti di prestazione autosomministrati, norme provvisorie.",

a_iq_n:"QI — intelligenza generale (g)",a_iq_d:"Capacità generale di ragionare, apprendere e risolvere problemi nuovi; g spiega circa metà della varianza tra i test cognitivi.",a_iq_m:"Batterie individuali (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) somministrate da uno psicologo con norme aggiornate; affidabilità composita ≈ ,95–,98. I test brevi online sono molto meno precisi.",
a_eq_n:"QE — intelligenza emotiva",a_eq_d:"Capacità di percepire, comprendere e regolare le emozioni (modello di abilità di Mayer–Salovey). Non è la IE «di tratto» dei questionari.",a_eq_m:"MSCEIT (punteggio per consenso/esperti) e compiti di percezione e comprensione delle emozioni. I questionari (EQ-i, TEIQue) misurano l'immagine di sé, debolmente correlata (~,2) all'abilità.",
a_cq_n:"QC — creatività",a_cq_d:"Capacità di produrre idee nuove e utili; il pensiero divergente ne è solo una componente.",a_cq_m:"Usi alternativi (AUT) o TTCT valutati da giudici indipendenti (tecnica di valutazione consensuale, Amabile) + risultati creativi documentati. L'originalità non può essere valutata in modo oggettivo da un semplice programma offline.",
a_cu_n:"QC — intelligenza culturale",a_cu_d:"Efficacia in contesti culturali diversi (Ang & Van Dyne): fattori metacognitivo, cognitivo, motivazionale, comportamentale.",a_cu_m:"CQS a 20 item (autovalutazione), versione per osservatori e test situazionali interculturali. Non esiste un test di prestazione consolidato.",
a_sq_n:"QS — intelligenza sociale",a_sq_d:"Capire le persone e agire in modo adeguato nelle situazioni sociali.",a_sq_m:"Test situazionali video con punteggio per consenso, più valutazioni di osservatori. Gli strumenti più vecchi si sovrappongono molto al QI verbale.",
a_aq_n:"QA — quoziente di avversità",a_aq_d:"Come si reagisce alle difficoltà (Stoltz). Il costrutto ha scarso sostegno psicometrico.",a_aq_m:"Meglio scale di resilienza validate (CD-RISC, BRS) e compiti comportamentali di persistenza; l'AQ Profile è soprattutto autovalutazione.",
a_ef_n:"Autocontrollo / funzioni esecutive",a_ef_d:"Inibizione, controllo attentivo, rinvio della ricompensa, decisioni sotto rischio.",a_ef_m:"Compiti comportamentali cronometrati (Stroop, Go/No-Go, sconto temporale, BART) — esattamente il tipo usato qui; affidabilità moderata, quindi da ripetere.",
a_mx_n:"QM, QS spirituale, QD e altri «quozienti»",a_mx_d:"Quozienti morale, spirituale, digitale, di curiosità, d'amore… sono per lo più etichette popolari.",a_mx_m:"Per la maggior parte mancano consenso scientifico, norme e validazione di criterio; un «punteggio» online non ha valore diagnostico. L'app non li misura, per non fabbricare falsa precisione.",
m_h:"Che cosa significa «il più oggettivo»",
m_1:"Prestazione, non opinione. L'autovalutazione è la meno oggettiva; l'app usa solo compiti con risposta verificabile o comportamento misurato.",
m_2:"Chiavi calcolate, non soggettive. Gli item sono generati proceduralmente e la risposta corretta segue da una regola; le forme sono parallele.",
m_3:"Condizioni standardizzate: tempo fisso, istruzioni identiche, nessun aiuto, schermo grande, luogo tranquillo, riposati.",
m_4:"Errore di misura. Ogni punteggio ha un errore standard; il composito di più test lo riduce e l'intervallo di confidenza al 95% è mostrato.",
m_5:"Ripetizione. Un solo punteggio è rumore: ripeti i test in giorni diversi e interpreta la media.",
m_6:"Norme. Senza un campione rappresentativo non esiste un vero QI. Le norme qui sono stimate e PROVVISORIE; l'intervallo include l'incertezza normativa (±0,3 DS).",
m_7:"Validità. Il punteggio dice cosa hai fatto in questi compiti, non il tuo valore. Per decisioni scolastiche, cliniche o professionali chiedi una valutazione psicologica standardizzata.",
m_lim:"Limiti: autosomministrazione, latenza e dispositivo variabili, pratica, stanchezza, nessun rilevamento di imbrogli. Un QI clinico valido richiede un esaminatore qualificato.",
i_text:"App offline, senza tracciamento. I risultati restano solo su questo dispositivo. Codice con licenza MIT.",f_tf:"Trade-free · offline · senza tracciamento"
},

a_iq_n:"CI — inteligencia general (g)",a_iq_d:"Capacidad general de razonar, aprender y resolver problemas nuevos; g explica cerca de la mitad de la varianza entre pruebas cognitivas.",a_iq_m:"Baterías individuales (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) aplicadas por un psicólogo con baremos actuales; fiabilidad compuesta ≈ ,95–,98. Las pruebas cortas en línea son mucho menos precisas.",
a_eq_n:"CE — inteligencia emocional",a_eq_d:"Habilidad de percibir, comprender y regular emociones (modelo de habilidad de Mayer–Salovey). No es la IE «rasgo» de los cuestionarios.",a_eq_m:"MSCEIT (puntuación por consenso/expertos) y tareas de percepción y comprensión de emociones. Los cuestionarios (EQ-i, TEIQue) miden la autoimagen, débilmente relacionada (~,2) con la habilidad.",
a_cq_n:"CC — creatividad",a_cq_d:"Capacidad de producir ideas nuevas y útiles; el pensamiento divergente es solo un componente.",a_cq_m:"Usos alternativos (AUT) o TTCT puntuados por jueces independientes (técnica de evaluación consensuada, Amabile) + logros creativos documentados. La originalidad no puede puntuarse objetivamente con un programa simple sin conexión.",
a_cu_n:"CC — inteligencia cultural",a_cu_d:"Eficacia en contextos culturales diversos (Ang & Van Dyne): factores metacognitivo, cognitivo, motivacional y conductual.",a_cu_m:"CQS de 20 ítems (autoinforme), versión para observadores y pruebas situacionales interculturales. No existe una prueba de rendimiento consolidada.",
a_sq_n:"CS — inteligencia social",a_sq_d:"Comprender a las personas y actuar con acierto en situaciones sociales.",a_sq_m:"Pruebas situacionales en vídeo con puntuación por consenso, más valoraciones de observadores. Los instrumentos antiguos se solapan mucho con el CI verbal.",
a_aq_n:"CA — cociente de adversidad",a_aq_d:"Cómo responde alguien a las dificultades (Stoltz). El constructo tiene escaso respaldo psicométrico.",a_aq_m:"Preferir escalas de resiliencia validadas (CD-RISC, BRS) y tareas conductuales de persistencia; el AQ Profile es sobre todo autoinforme.",
a_ef_n:"Autocontrol / funciones ejecutivas",a_ef_d:"Inhibición, control atencional, demora de la recompensa, decisión bajo riesgo.",a_ef_m:"Tareas conductuales cronometradas (Stroop, Go/No-Go, descuento por demora, BART) — justo el tipo usado aquí; fiabilidad moderada, por eso se repiten.",
a_mx_n:"CM, CS espiritual, CD y otros «cocientes»",a_mx_d:"Cocientes moral, espiritual, digital, de curiosidad, de amor… son sobre todo etiquetas populares.",a_mx_m:"La mayoría carece de consenso científico, baremos o validación de criterio; una «puntuación» en línea no tiene valor diagnóstico. La aplicación no los mide para no fabricar falsa precisión.",
m_h:"Qué significa «lo más objetivo»",
m_1:"Rendimiento, no opinión. El autoinforme es lo menos objetivo; la aplicación solo usa tareas con respuesta verificable o conducta medida.",
m_2:"Claves calculadas, no subjetivas. Los ítems se generan por procedimiento y la respuesta correcta se deriva de una regla; las formas son paralelas.",
m_3:"Condiciones estandarizadas: tiempo fijo, instrucciones idénticas, sin ayudas, pantalla grande, lugar tranquilo, descansado.",
m_4:"Error de medida. Toda puntuación tiene un error estándar; un compuesto de varias pruebas lo reduce y se muestra el intervalo de confianza del 95 %.",
m_5:"Repetición. Una sola puntuación es ruido: repite las pruebas en días distintos e interpreta el promedio.",
m_6:"Normas. Sin muestra representativa no hay CI real. Las normas aquí son estimadas y PROVISIONALES; el intervalo incluye incertidumbre normativa (±0,3 DE).",
m_7:"Validez. La puntuación dice lo que hiciste en estas tareas, no tu valor. Para decisiones escolares, clínicas o laborales, pide una evaluación psicológica estandarizada.",
m_lim:"Límites: autoadministración, latencia y dispositivo variables, práctica, fatiga, sin detección de trampas. Un CI clínico válido requiere un examinador cualificado.",
i_text:"Aplicación sin conexión y sin rastreo. Los resultados quedan solo en este dispositivo. Código bajo licencia MIT.",f_tf:"Trade-free · sin conexión · sin rastreo"
},

a_iq_n:"QI — inteligência geral (g)",a_iq_d:"Capacidade geral de raciocinar, aprender e resolver problemas novos; o g explica cerca de metade da variância entre testes cognitivos.",a_iq_m:"Baterias individuais (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) aplicadas por um psicólogo com normas atuais; fiabilidade compósita ≈ ,95–,98. Testes curtos online são muito menos precisos.",
a_eq_n:"QE — inteligência emocional",a_eq_d:"Aptidão para perceber, compreender e regular emoções (modelo de aptidão de Mayer–Salovey). Não é a IE «traço» dos questionários.",a_eq_m:"MSCEIT (cotação por consenso/peritos) e tarefas de perceção e compreensão de emoções. Os questionários (EQ-i, TEIQue) medem a autoimagem, fracamente relacionada (~,2) com a aptidão.",
a_cq_n:"QC — criatividade",a_cq_d:"Capacidade de produzir ideias novas e úteis; o pensamento divergente é só uma componente.",a_cq_m:"Usos alternativos (AUT) ou TTCT cotados por juízes independentes (técnica de avaliação consensual, Amabile) + realizações criativas documentadas. A originalidade não pode ser cotada objetivamente por um programa simples offline.",
a_cu_n:"QC — inteligência cultural",a_cu_d:"Eficácia em contextos culturais diversos (Ang & Van Dyne): fatores metacognitivo, cognitivo, motivacional e comportamental.",a_cu_m:"CQS de 20 itens (autorrelato), versão para observadores e testes situacionais interculturais. Não existe um teste de desempenho consolidado.",

a_aq_n:"QA — quociente de adversidade",a_aq_d:"Como alguém responde às dificuldades (Stoltz). O construto tem fraco suporte psicométrico.",a_aq_m:"Preferir escalas de resiliência validadas (CD-RISC, BRS) e tarefas comportamentais de persistência; o AQ Profile é sobretudo autorrelato.",
a_ef_n:"Autocontrolo / funções executivas",a_ef_d:"Inibição, controlo atencional, adiamento da recompensa, decisão sob risco.",a_ef_m:"Tarefas comportamentais cronometradas (Stroop, Go/No-Go, desconto por atraso, BART) — exatamente o tipo usado aqui; fiabilidade moderada, por isso repetem-se.",
a_mx_n:"QM, QS espiritual, QD e outros «quocientes»",a_mx_d:"Quocientes moral, espiritual, digital, de curiosidade, de amor… são sobretudo rótulos populares.",a_mx_m:"A maioria não tem consenso científico, normas nem validação de critério; uma «pontuação» online não tem valor diagnóstico. A aplicação não os mede, para não fabricar falsa precisão.",
m_h:"O que significa «o mais objetivo»",
m_1:"Desempenho, não opinião. O autorrelato é o menos objetivo; a aplicação usa apenas tarefas com resposta verificável ou comportamento medido.",

a_iq_n:"IQ — allgemeine Intelligenz (g)",a_iq_d:"Allgemeine Fähigkeit zu denken, zu lernen und neue Probleme zu lösen; g erklärt etwa die Hälfte der Varianz zwischen kognitiven Tests.",a_iq_m:"Individuelle Testbatterien (WAIS-V, Stanford-Binet 5, Woodcock-Johnson) durch Psychologen mit aktuellen Normen; Reliabilität des Gesamtwerts ≈ ,95–,98. Kurze Online-Tests sind weit ungenauer.",
a_eq_n:"EQ — emotionale Intelligenz",a_eq_d:"Fähigkeit, Emotionen wahrzunehmen, zu verstehen und zu regulieren (Fähigkeitsmodell nach Mayer–Salovey). Nicht dasselbe wie „Trait“-EI aus Fragebögen.",a_eq_m:"MSCEIT (Konsens-/Expertenwertung) und Aufgaben zur Emotionswahrnehmung und -verständnis. Fragebögen (EQ-i, TEIQue) erfassen das Selbstbild, nur schwach (~,2) mit der Fähigkeit verknüpft.",
a_cq_n:"KQ — Kreativität",a_cq_d:"Fähigkeit, neuartige und nützliche Ideen hervorzubringen; divergentes Denken ist nur eine Komponente.",a_cq_m:"Alternative Verwendungen (AUT) oder TTCT, von unabhängigen Ratern bewertet (Consensual Assessment Technique, Amabile) + dokumentierte kreative Leistungen. Originalität lässt sich von einem einfachen Offline-Programm nicht objektiv bewerten.",
a_cu_n:"KQ — kulturelle Intelligenz",a_cu_d:"Wirksamkeit in kulturell vielfältigen Kontexten (Ang & Van Dyne): metakognitive, kognitive, motivationale, Verhaltensfaktoren.",a_cu_m:"CQS mit 20 Items (Selbstauskunft), Beobachterversion und interkulturelle Situationstests. Einen etablierten Leistungstest gibt es nicht.",
a_sq_n:"SQ — soziale Intelligenz",a_sq_d:"Menschen verstehen und in sozialen Situationen angemessen handeln.",a_sq_m:"Videobasierte Situationstests mit Konsenswertung plus Beobachterurteile. Ältere Instrumente überlappen stark mit verbalem IQ.",

v_ver:"Version",v_upd:"Dernière mise à jour",f_search:"Rechercher dans l'atlas…",f_tier:"Niveau d'objectivité",f_all:"Tous les niveaux",f_reset:"Réinitialiser les filtres",f_res:"{n} résultats",
a_chc_n:"Modèle CHC — la famille « G » (Gf, Gc, Gv, Gwm, Gs, Gq…)",a_chc_d:"La structure scientifique dominante : un facteur général g et une dizaine d'aptitudes larges (fluide, cristallisée, visuo-spatiale, mémoire de travail, vitesse, quantitative…).",a_chc_m:"Les batteries modernes (WAIS-V, WJ-V, KABC) reposent sur le CHC ; chaque aptitude large demande 2–3 sous-tests, et le profil compte plus qu'un seul chiffre.",
a_ec_n:"QE-empathie, SQ-R, AQ-autisme (Baron-Cohen)",a_ec_d:"Trois « quotients » qui portent le même nom que d'autres mais signifient autre chose : Empathy Quotient, Systemizing Quotient, Autism-Spectrum Quotient — questionnaires de recherche.",a_ec_m:"Tous sont des auto-évaluations (niveau 4). L'AQ-autisme est un outil de dépistage, pas un diagnostic ; le test « Reading the Mind in the Eyes » a une validité discutée.",
a_pr_n:"Intelligence pratique / réussie (Sternberg)",a_pr_d:"Capacité de résoudre des problèmes réels du quotidien grâce aux connaissances tacites ; partie de la théorie triarchique.",a_pr_m:"Tests situationnels notés par rapport à des experts (p. ex. Sternberg Triarchic Abilities Test, inventaires de connaissances tacites) ; validité plus faible que pour g.",
a_rq_n:"QR — quotient de rationalité",a_rq_d:"Qualité de la pensée et des décisions, pas seulement capacité : éviter les biais, pensée probabiliste, réflexion.",a_rq_m:"CART (Stanovich) et Cognitive Reflection Test : tâches de performance à réponse correcte ; corrélation modérée avec le QI, mais distinct.",
a_wi_n:"Sagesse (QS)",a_wi_d:"Jugement face à des dilemmes de vie incertains, perspectives multiples, humilité épistémique.",a_wi_m:"Paradigme de Berlin : réponses à des dilemmes cotées par des évaluateurs formés. Les échelles d'auto-évaluation (3D-WS, SAWS) sont bien plus faibles.",
a_mu_n:"QM — aptitude musicale",a_mu_d:"Perception de la hauteur, du rythme et de la mélodie ; distincte de la formation musicale.",a_mu_m:"PROMS, Musical Ear Test, batteries de Gordon ; ici : discrimination adaptative de hauteur (seuils en cents) — casque recommandé.",
a_ck_n:"QC — quotient de curiosité",a_ck_d:"Envie de rechercher des informations nouvelles et de tolérer l'incertitude.",a_ck_m:"Le CEI-II (Kashdan) est une auto-évaluation (niveau 4) ; les mesures comportementales (temps d'exploration, choix d'information) sont plus objectives mais non standardisées.",
a_dq_n:"QN — intelligence numérique",a_dq_d:"Compétences numériques, sociales et émotionnelles pour la vie en ligne (cadre DQ / IEEE 3527.1).",a_dq_m:"Évaluations par tâches et scénarios (DQ Institute) ; qualité variable — cherchez des tests aux normes publiques.",
a_bk_n:"QP — intelligence corporelle-kinesthésique",a_bk_d:"Coordination, habileté motrice fine et globale (Gardner) ; en psychométrie : aptitudes psychomotrices.",a_bk_m:"BOT-2, MABC-2 et épreuves de dextérité passées avec un spécialiste ; les mesures à l'écran ne les remplacent pas.",
a_mo_n:"QM — intelligence morale",a_mo_d:"Raisonnement moral et comportement éthique.",a_mo_m:"Defining Issues Test (DIT-2), entretiens Kohlberg/Colby ; tâches de dilemme à cotation standardisée, mais pas une aptitude au sens du QI.",
a_sp_n:"QS — intelligence spirituelle",a_sp_d:"Proposée par Zohar et Marshall : sens, valeurs, transcendance.",a_sp_m:"SISRI-24 (auto-évaluation) ; statut scientifique discuté — recoupe la personnalité et la religiosité. Non mesurée ici.",
a_mx_n:"Autres « quotients » (QA, QB, QSa…)",a_mx_d:"Quotients d'amour, d'affaires, de santé, de jeu… sont surtout des étiquettes commerciales ou populaires.",a_mx_m:"Ni consensus scientifique, ni normes, ni validation de critère ; un « score » en ligne n'a aucune valeur diagnostique. L'application ne les mesure pas, pour ne pas fabriquer une fausse précision."
},

tt_rt:"Tempo di reazione",ti_rt:"Premi appena il campo diventa verde; non anticipare. 20 prove.",

a_chc_n:"Modello CHC — la famiglia «G» (Gf, Gc, Gv, Gwm, Gs, Gq…)",a_chc_d:"La struttura scientifica dominante: un fattore generale g e circa dieci abilità ampie (fluida, cristallizzata, visuospaziale, memoria di lavoro, velocità, quantitativa…).",a_chc_m:"Le batterie moderne (WAIS-V, WJ-V, KABC) si basano sul CHC; ogni abilità ampia richiede 2–3 sottotest e il profilo conta più di un solo numero.",
a_ec_n:"QE-empatia, SQ-R, AQ-autismo (Baron-Cohen)",a_ec_d:"Tre «quozienti» che hanno lo stesso nome di altri ma un altro significato: Empathy Quotient, Systemizing Quotient, Autism-Spectrum Quotient — questionari di ricerca.",a_ec_m:"Sono tutte autovalutazioni (livello 4). L'AQ-autismo è uno strumento di screening, non una diagnosi; il test «Reading the Mind in the Eyes» ha validità discussa.",
a_pr_n:"Intelligenza pratica / di successo (Sternberg)",a_pr_d:"Capacità di risolvere problemi reali quotidiani grazie alla conoscenza tacita; parte della teoria triarchica.",a_pr_m:"Test situazionali valutati rispetto a esperti (es. Sternberg Triarchic Abilities Test, inventari di conoscenza tacita); evidenze di validità più deboli che per g.",
a_rq_n:"QR — quoziente di razionalità",a_rq_d:"Qualità del pensiero e delle decisioni, non solo capacità: evitare i bias, pensiero probabilistico, riflessione.",a_rq_m:"CART (Stanovich) e Cognitive Reflection Test: compiti di prestazione con risposta corretta; correlazione moderata con il QI, ma distinto.",
a_wi_n:"Saggezza (QS)",a_wi_d:"Giudizio in dilemmi di vita incerti, prospettive multiple, umiltà epistemica.",a_wi_m:"Paradigma di Berlino: risposte a dilemmi valutate da giudici addestrati. Le scale di autovalutazione (3D-WS, SAWS) sono molto più deboli.",
a_mu_n:"QM — attitudine musicale",a_mu_d:"Percezione di altezza, ritmo e melodia; distinta dalla formazione musicale.",a_mu_m:"PROMS, Musical Ear Test, batterie di Gordon; qui: discriminazione adattiva dell'altezza (soglie in cent) — consigliate le cuffie.",
a_ck_n:"QC — quoziente di curiosità",a_ck_d:"Spinta a cercare informazioni nuove e a tollerare l'incertezza.",a_ck_m:"Il CEI-II (Kashdan) è un'autovalutazione (livello 4); le misure comportamentali (tempo di esplorazione, scelte di informazione) sono più oggettive ma non standardizzate.",
a_dq_n:"QD — intelligenza digitale",a_dq_d:"Competenze digitali, sociali ed emotive per la vita online (quadro DQ / IEEE 3527.1).",a_dq_m:"Valutazioni basate su compiti e scenari (DQ Institute); qualità variabile — cerca test con norme pubbliche.",
a_bk_n:"QF — intelligenza corporeo-cinestetica",a_bk_d:"Coordinazione, abilità motoria fine e grossolana (Gardner); in psicometria: attitudini psicomotorie.",a_bk_m:"BOT-2, MABC-2 e prove di destrezza somministrate da uno specialista; le misure su schermo non le sostituiscono.",
a_mo_n:"QM — intelligenza morale",a_mo_d:"Ragionamento morale e comportamento etico.",a_mo_m:"Defining Issues Test (DIT-2), interviste Kohlberg/Colby; compiti di dilemma con punteggio standardizzato, ma non un'abilità in senso QI.",
a_sp_n:"QS — intelligenza spirituale",a_sp_d:"Proposta da Zohar e Marshall: senso, valori, trascendenza.",a_sp_m:"SISRI-24 (autovalutazione); status scientifico discusso — si sovrappone a personalità e religiosità. Non misurata qui.",
a_mx_n:"Altri «quozienti» (QA, QB, QS…)",a_mx_d:"Quozienti d'amore, d'affari, di salute, di gioco… sono per lo più etichette commerciali o popolari.",a_mx_m:"Nessun consenso scientifico, norme o validazione di criterio; un «punteggio» online non ha valore diagnostico. L'app non li misura, per non fabbricare falsa precisione."
},

a_chc_n:"Modelo CHC — la familia «G» (Gf, Gc, Gv, Gwm, Gs, Gq…)",a_chc_d:"La estructura científica dominante: un factor general g y unas diez aptitudes amplias (fluida, cristalizada, visoespacial, memoria de trabajo, velocidad, cuantitativa…).",a_chc_m:"Las baterías modernas (WAIS-V, WJ-V, KABC) se basan en el CHC; cada aptitud amplia requiere 2–3 subpruebas y el perfil importa más que un solo número.",
a_ec_n:"CE-empatía, SQ-R, AQ-autismo (Baron-Cohen)",a_ec_d:"Tres «cocientes» con el mismo nombre que otros pero distinto significado: Empathy Quotient, Systemizing Quotient, Autism-Spectrum Quotient — cuestionarios de investigación.",a_ec_m:"Todos son autoinformes (nivel 4). El AQ-autismo es una herramienta de cribado, no un diagnóstico; la prueba «Reading the Mind in the Eyes» tiene validez discutida.",
a_pr_n:"Inteligencia práctica / exitosa (Sternberg)",a_pr_d:"Capacidad de resolver problemas reales cotidianos con conocimiento tácito; parte de la teoría triárquica.",a_pr_m:"Pruebas situacionales puntuadas frente a expertos (p. ej. Sternberg Triarchic Abilities Test, inventarios de conocimiento tácito); evidencia de validez más débil que para g.",
a_rq_n:"CR — cociente de racionalidad",a_rq_d:"Calidad del pensamiento y de las decisiones, no solo capacidad: evitar sesgos, pensamiento probabilístico, reflexión.",a_rq_m:"CART (Stanovich) y Cognitive Reflection Test: tareas de rendimiento con respuesta correcta; correlación moderada con el CI, pero distinto.",
a_wi_n:"Sabiduría (CS)",a_wi_d:"Juicio ante dilemas vitales inciertos, perspectivas múltiples, humildad epistémica.",a_wi_m:"Paradigma de Berlín: respuestas a dilemas puntuadas por evaluadores entrenados. Las escalas de autoinforme (3D-WS, SAWS) son mucho más débiles.",
a_mu_n:"CM — aptitud musical",a_mu_d:"Percepción de tono, ritmo y melodía; distinta de la formación musical.",a_mu_m:"PROMS, Musical Ear Test, baterías de Gordon; aquí: discriminación adaptativa de tono (umbrales en cents) — se recomiendan auriculares.",
a_ck_n:"CC — cociente de curiosidad",a_ck_d:"Impulso de buscar información nueva y tolerar la incertidumbre.",a_ck_m:"El CEI-II (Kashdan) es autoinforme (nivel 4); las medidas conductuales (tiempo de exploración, elecciones de información) son más objetivas pero no estandarizadas.",
a_dq_n:"CD — inteligencia digital",a_dq_d:"Competencias digitales, sociales y emocionales para la vida en línea (marco DQ / IEEE 3527.1).",a_dq_m:"Evaluaciones basadas en tareas y escenarios (DQ Institute); calidad variable — busca pruebas con baremos públicos.",
a_bk_n:"CF — inteligencia corporal-kinestésica",a_bk_d:"Coordinación, habilidad motriz fina y gruesa (Gardner); en psicometría: aptitudes psicomotoras.",a_bk_m:"BOT-2, MABC-2 y pruebas de destreza aplicadas por un especialista; las medidas en pantalla no las sustituyen.",
a_mo_n:"CM — inteligencia moral",a_mo_d:"Razonamiento moral y conducta ética.",a_mo_m:"Defining Issues Test (DIT-2), entrevistas Kohlberg/Colby; tareas de dilema con puntuación estandarizada, pero no una aptitud en el sentido del CI.",
a_sp_n:"CE — inteligencia espiritual",a_sp_d:"Propuesta por Zohar y Marshall: sentido, valores, trascendencia.",a_sp_m:"SISRI-24 (autoinforme); estatus científico discutido — se solapa con personalidad y religiosidad. No se mide aquí.",
a_mx_n:"Otros «cocientes» (CA, CN, CS…)",a_mx_d:"Cocientes de amor, de negocios, de salud, de juego… son sobre todo etiquetas comerciales o populares.",a_mx_m:"Sin consenso científico, baremos ni validación de criterio; una «puntuación» en línea no tiene valor diagnóstico. La aplicación no los mide para no fabricar falsa precisión."
},

a_chc_n:"CHC-Modell — die „G“-Familie (Gf, Gc, Gv, Gwm, Gs, Gq…)",a_chc_d:"Die dominierende wissenschaftliche Struktur: ein Generalfaktor g plus etwa zehn breite Fähigkeiten (fluide, kristalline, visuell-räumliche, Arbeitsgedächtnis, Tempo, quantitative…).",a_chc_m:"Moderne Testbatterien (WAIS-V, WJ-V, KABC) beruhen auf CHC; jede breite Fähigkeit braucht 2–3 Untertests, und das Profil zählt mehr als eine einzelne Zahl.",
a_ec_n:"EQ-Empathie, SQ-R, AQ-Autismus (Baron-Cohen)",a_ec_d:"Drei „Quotienten“ mit denselben Namen wie andere, aber anderer Bedeutung: Empathy Quotient, Systemizing Quotient, Autism-Spectrum Quotient — Forschungsfragebögen.",a_ec_m:"Alle sind Selbstauskünfte (Stufe 4). Der Autismus-AQ ist ein Screening-Instrument, keine Diagnose; der Test „Reading the Mind in the Eyes“ hat umstrittene Validität.",
a_pr_n:"Praktische / erfolgreiche Intelligenz (Sternberg)",a_pr_d:"Fähigkeit, reale Alltagsprobleme mit implizitem Wissen zu lösen; Teil der triarchischen Theorie.",a_pr_m:"Situationstests, an Experten bewertet (z. B. Sternberg Triarchic Abilities Test, Inventare impliziten Wissens); Validitätsbelege schwächer als für g.",
a_rq_n:"RQ — Rationalitätsquotient",a_rq_d:"Qualität von Denken und Entscheiden, nicht nur Kapazität: Verzerrungen vermeiden, probabilistisches Denken, Reflexion.",a_rq_m:"CART (Stanovich) und Cognitive Reflection Test: Leistungsaufgaben mit richtiger Antwort; mäßig mit dem IQ korreliert, aber eigenständig.",
a_wi_n:"Weisheit (WQ)",a_wi_d:"Urteilen in unsicheren Lebensdilemmata, mehrere Perspektiven, epistemische Demut.",a_wi_m:"Berliner Weisheitsparadigma: Antworten auf Dilemmata, von geschulten Ratern bewertet. Selbstauskunftsskalen (3D-WS, SAWS) sind deutlich schwächer.",

ro:{tab_n:"Noutăți",n_h:"Noutăți verificate pe sursă (2–3 noiembrie 2026)",
n_note:"Cifrele sunt copiate din paginile citate. Unde sursa se contrazice sau am citit-o parțial, este spus. Nu am găsit și verificat nicio constatare nouă despre efectul Flynn, deci nu afirm niciuna.",
n_1:"WAIS-5 (2024): 16:0–90:11 ani; IQ total din 7 subteste; cinci indici principali; indici auxiliari (pagina editorului se contrazice: numără 13 numiți, spune „paisprezece” și „15”); administrare pe hârtie sau Q-interactive (iPad); ghid de telepractică.",
n_2:"WJ V: postarea Riverside din 8 iunie 2025 spune că a fost lansat „oficial ca evaluare complet digitală”; examinator pe laptop, examinat pe iPad de 10 inchi sau mai mare; scorare automată; conținut aliniat cu teoria CHC.",
n_3:"MSCEIT 2 (Mayer și colab., Frontiers in Psychology, 2 iunie 2025): 83 de itemi; rezumatul spune „cu 33% mai scurt” (numărul de itemi sugerează mai mult, fără explicație); scorare veridică, itemii fără acord între experți au fost eliminați; modelul cu patru factori se potrivește cel mai bine; r = −0,07 cu o scală de autoevaluare.",
n_4:"Scherrer și colab., J Intell 2025: 226 de participanți valizi, 74 cu webcam; fraudă observabilă 4% (3 persoane); fără efect principal semnificativ al supravegherii, dar cu interacțiune semnificativă cu tipul de test; sarcinile de memorie sunt cele mai vulnerabile.",
n_5:"Hickman, Int J Selection and Assessment 2025 (comunicat Virginia Tech): modelul o1 „face inutile” evaluările nesupravegheate; „aproape o treime” dintre candidați ar folosi LLM-uri, după un sondaj de industrie nenumit și neverificat de mine.",
n_6:"Urban, Kmoníčková, Urban (NeurIPS 2025): șapte LLM-uri pe o sarcină de utilizări alternative; răspunsurile LLM originale au fost cotate mult mai originale decât cele umane (d median 1,46); „umanizarea” stilului a scăzut scorul; evaluatorii automați sunt parțial induși în eroare de stil.",
n_7:"DQ, IEEE 3527.1-2020: aprobat la 24 septembrie 2020 de IEEE, cu DQ Institute și Singtel. Nu e o noutate; îl păstrez ca reper și nu am verificat dacă a fost revizuit.",
a_iq_m:"Baterii individuale (de ex. WAIS-5, 2024; WJ V, 2025) administrate de psiholog, cu norme actuale. Testele scurte online sunt mult mai imprecise.",
a_eq_m:"MSCEIT 2 (2025; scorare veridică, patru ramuri) și sarcini de percepție și înțelegere a emoțiilor. Scalele de autoevaluare corelează slab cu abilitatea (r = −0,07 într-un studiu MSCEIT 2)."},
en:{tab_n:"News",n_h:"News checked against sources (2–3 November 2026)",
n_note:"Figures are copied from the cited pages. Where a source contradicts itself or I read it only in part, it says so. I found and verified no new Flynn-effect finding, so I claim none.",
n_1:"WAIS-5 (2024): ages 16:0–90:11; full-scale IQ from 7 subtests; five primary indexes; ancillary indexes (the publisher's page contradicts itself: 13 named, “fourteen” and “15” stated); paper or Q-interactive (iPad) administration; telepractice guidance.",
n_2:"WJ V: a Riverside post dated 8 June 2025 says it “officially launched as a fully digital assessment”; examiner on a laptop, examinee on an iPad of 10 inches or larger; automated scoring; content aligned with CHC theory.",
n_3:"MSCEIT 2 (Mayer et al., Frontiers in Psychology, 2 June 2025): 83 items; the abstract says “33% shorter” (the item counts imply more, unexplained); veridical scoring, items without expert agreement removed; the four-factor model fit best; r = −0.07 with a self-report scale.",
n_4:"Scherrer et al., J Intell 2025: 226 valid participants, 74 on webcam; observable cheating 4% (3 people); no significant main effect of proctoring but a significant interaction with test type; memory tasks are the most vulnerable.",
n_5:"Hickman, Int J Selection and Assessment 2025 (Virginia Tech release): o1 “renders unproctored assessments worthless”; “nearly one-third” of applicants reportedly use LLMs, from an unnamed industry survey I have not verified.",
n_6:"Urban, Kmoníčková, Urban (NeurIPS 2025): seven LLMs on an alternative-uses task; verbatim LLM answers were rated far more original than human ones (median d = 1.46); “humanizing” the style lowered scores; automated scorers are partly misled by style.",
n_7:"DQ, IEEE 3527.1-2020: approved 24 September 2020 by IEEE, with DQ Institute and Singtel. Not news; kept as a reference, and I did not check whether it has been revised.",
a_iq_m:"Individual batteries (e.g. WAIS-5, 2024; WJ V, 2025) given by a psychologist with current norms. Short online tests are far less precise.",
a_eq_m:"MSCEIT 2 (2025; veridical scoring, four branches) and emotion perception and understanding tasks. Self-report scales correlate weakly with ability (r = −0.07 in one MSCEIT 2 study)."},
fr:{tab_n:"Nouveautés",n_h:"Nouveautés vérifiées à la source (2–3 novembre 2026)",

n_1:"WAIS-5 (2024) : 16:0–90:11 ans ; QI total à partir de 7 subtests ; cinq indices principaux ; indices auxiliaires (la page de l'éditeur se contredit : 13 nommés, « quatorze » et « 15 » annoncés) ; passation papier ou Q-interactive (iPad) ; guide de télépratique.",
n_2:"WJ V : un billet de Riverside daté du 8 juin 2025 dit qu'il a été « officiellement lancé comme évaluation entièrement numérique » ; examinateur sur ordinateur portable, examiné sur iPad de 10 pouces ou plus ; cotation automatique ; contenu aligné sur la théorie CHC.",
n_3:"MSCEIT 2 (Mayer et al., Frontiers in Psychology, 2 juin 2025) : 83 items ; le résumé dit « 33 % plus court » (le nombre d'items suggère davantage, sans explication) ; cotation véridique, items sans accord des experts supprimés ; le modèle à quatre facteurs s'ajuste le mieux ; r = −0,07 avec une échelle d'auto-évaluation.",

n_6:"Urban, Kmoníčková, Urban (NeurIPS 2025) : sept LLM sur une tâche d'usages alternatifs ; les réponses brutes des LLM sont jugées bien plus originales que celles des humains (d médian = 1,46) ; « humaniser » le style baisse les scores ; les évaluateurs automatiques sont en partie trompés par le style.",

a_iq_m:"Batteries individuelles (p. ex. WAIS-5, 2024 ; WJ V, 2025) passées avec un psychologue, normes actuelles. Les tests courts en ligne sont bien moins précis.",

n_1:"WAIS-5 (2024): 16:0–90:11 años; CI total a partir de 7 subpruebas; cinco índices principales; índices auxiliares (la página del editor se contradice: 13 nombrados, «catorce» y «15» declarados); aplicación en papel o Q-interactive (iPad); guía de telepráctica.",

a_iq_m:"Individuelle Testbatterien (z. B. WAIS-5, 2024; WJ V, 2025) durch Psychologen mit aktuellen Normen. Kurze Online-Tests sind weit ungenauer.",
a_eq_m:"MSCEIT 2 (2025; veridikale Auswertung, vier Zweige) und Aufgaben zur Emotionswahrnehmung und -verständnis. Selbstbericht-Skalen korrelieren schwach mit der Fähigkeit (r = −0,07 in einer MSCEIT-2-Studie)."},
hu:{tab_n:"Újdonságok",n_h:"Forrásnál ellenőrzött újdonságok (2026. november 2–3.)",
n_note:"A számok a hivatkozott oldalakról másoltak. Ahol a forrás önmagának ellentmond, vagy csak részben olvastam, jelezzük. A Flynn-hatásról nem találtam és nem ellenőriztem új megállapítást, ezért nem állítok semmit.",
n_1:"WAIS-5 (2024): 16:0–90:11 évesek; teljes IQ 7 altesztből; öt elsődleges index; kiegészítő indexek (a kiadó oldala önmagának ellentmond: 13 megnevezve, „tizennégy” és „15” állítva); papíros vagy Q-interactive (iPad) felvétel; telepraxis-útmutató.",
n_2:"WJ V: egy 2025. június 8-i Riverside-bejegyzés szerint „hivatalosan teljesen digitális értékelésként indult”; a vizsgáztató laptopon, a vizsgázó 10 hüvelykes vagy nagyobb iPaden; automatikus pontozás; a tartalom a CHC-elmélethez igazodik.",
n_3:"MSCEIT 2 (Mayer és mtsai., Frontiers in Psychology, 2025. június 2.): 83 tétel; az absztrakt „33%-kal rövidebb”-et mond (a tételszám többet sejtet, magyarázat nélkül); veridikális pontozás, a szakértői egyetértés nélküli tételeket elhagyták; a négyfaktoros modell illeszkedik a legjobban; r = −0,07 egy önbeszámolós skálával.",
n_4:"Scherrer és mtsai., J Intell 2025: 226 érvényes résztvevő, 74 webkamerával; megfigyelhető csalás 4% (3 fő); a felügyeletnek nincs szignifikáns főhatása, de szignifikáns az interakció a tesztfajtával; a memóriafeladatok a legsebezhetőbbek.",
n_5:"Hickman, Int J Selection and Assessment 2025 (Virginia Tech közlemény): az o1 „értéktelenné teszi” a felügyelet nélküli értékeléseket; a jelentkezők „közel harmada” használna nyelvi modelleket egy meg nem nevezett, általam nem ellenőrzött iparági felmérés szerint.",
n_6:"Urban, Kmoníčková, Urban (NeurIPS 2025): hét nyelvi modell egy alternatív felhasználás feladaton; az eredeti modellválaszokat sokkal eredetibbnek ítélték az emberieknél (medián d = 1,46); a stílus „emberivé tétele” csökkentette a pontokat; az automatikus értékelőket részben megtéveszti a stílus.",
n_7:"DQ, IEEE 3527.1-2020: 2020. szeptember 24-én hagyta jóvá az IEEE, a DQ Institute-tal és a Singtellel. Nem újdonság; referenciaként maradt, nem ellenőriztem, hogy módosították-e.",
a_iq_m:"Egyéni tesztbatériák (pl. WAIS-5, 2024; WJ V, 2025) pszichológus felvételében, friss normákkal. A rövid online tesztek sokkal pontatlanabbak.",
a_eq_m:"MSCEIT 2 (2025; veridikális pontozás, négy ág) és érzelemészlelési, -megértési feladatok. Az önbeszámolós skálák gyengén korrelálnak a képességgel (r = −0,07 egy MSCEIT 2 vizsgálatban)."}

ro:{
m_1:"Performanță, nu opinie. Autoraportarea este cea mai puțin obiectivă; aplicația folosește doar sarcini de performanță sau comportament. Majoritatea au răspuns cu cheie, dar creativitatea (AUT) se bazează pe etichetarea ta și pe evaluatorul extern opțional, iar chipurile sunt desene schematice nevalidate pe norme de recunoaștere.",
m_2:"Itemii sunt generați procedural din șabloane și răspunsul corect decurge dintr-o regulă, deci nu se repetă între încercări. Echivalența formelor paralele (aceeași dificultate la toate semințele) NU a fost testată empiric.",
m_4:"Eroarea de măsurare. Orice scor are o eroare standard. Compozitul este tras spre medie proporțional cu cât de bine măsoară testele împreună factorul (r²), iar intervalul de 95% este afișat; presupune intercorelații medii (0,40 IQ; 0,25 EQ; 0,15 executive; 0,10 simțuri) estimate de mine, nu măsurate.",
m_6:"Norme. Fără un eșantion reprezentativ nu există IQ real. Normele de aici sunt estimările mele, PROVIZORII; intervalul adaugă pentru ele o eroare standard de 0,3 DS, eliminată după calibrarea cu 30+ persoane.",
m_12:"Cronometrare și scoruri-diferență. Timpul din browser și dispozitivele de intrare adaugă zeci de milisecunde de eroare, iar scorurile-diferență (interferența) sunt mai puțin fiabile decât scorurile simple; un studiu publicat pe sarcini clasice a găsit fidelități test–retest între 0 și 0,82 (Hedge și colab., 2018).",
m_lim:"Limite: autoadministrare, latență și dispozitiv variabile, exercițiu, oboseală. Se înregistrează doar pierderea focusului ferestrei; aplicația nu poate detecta ajutorul unei IA, al unei alte persoane sau al notițelor. Un IQ clinic valid cere un examinator calificat.",
a_iq_d:"Capacitatea generală de a raționa, a învăța și a rezolva probleme noi; g explică o parte mare din varianța dintre testele cognitive (estimările variază după baterie).",
a_chc_d:"O structură științifică larg folosită: un factor general g (în unele versiuni) plus abilități largi (fluidă, cristalizată, vizuospațială, memorie de lucru, viteză, cantitativă…), circa zece.",
a_chc_m:"Mai multe baterii moderne se interpretează prin CHC; editorul spune că WJ V este aliniat la teoria CHC, iar scalele Wechsler se mapează frecvent pe ea. Interpretează profilul, nu doar un număr.",
a_ef_m:"Sarcini comportamentale cronometrate (Stroop, flanker, Go/No-Go, scontarea întârzierii, BART) sunt de felul celor folosite aici, dar scorurile de interferență pot fi nefiabile (fidelități publicate între 0 și 0,82 pentru sarcini clasice), deci repetă-le și interpretează cu prudență.",
a_cq_m:"Utilizări alternative (AUT) cotate de evaluatori independenți, tehnica evaluării consensuale (Amabile) sau TTCT cu cotatori instruiți, plus realizări creative documentate. Originalitatea nu poate fi cotată obiectiv de un simplu program offline."},
en:{
m_1:"Performance, not opinion. Self-report is the least objective; the app uses only performance or behaviour tasks. Most have a keyed answer, but creativity (AUT) relies on your own tagging and the optional external rater, and the faces are schematic drawings not validated against recognition norms.",
m_2:"Items are generated procedurally from templates and the correct answer follows from a rule, so items do not repeat across attempts. Parallel-form equivalence (equal difficulty across seeds) has NOT been tested empirically.",
m_4:"Measurement error. Every score has a standard error. The composite is shrunk toward the mean in proportion to how well the tests together measure the factor (r²), and a 95% interval is shown; it assumes average intercorrelations (0.40 IQ, 0.25 EQ, 0.15 executive, 0.10 senses) that I estimated, not measured.",
m_6:"Norms. Without a representative sample there is no real IQ. Norms here are my estimates and PROVISIONAL; the interval adds a standard error of 0.3 SD for them, dropped once you calibrate with 30+ people.",
m_12:"Timing and difference scores. Browser timing and input devices add tens of milliseconds of error, and difference scores (interference) are less reliable than plain scores; a published study of classic tasks found test–retest reliabilities from 0 to .82 (Hedge et al., 2018).",
m_lim:"Limits: self-administration, variable latency and device, practice, fatigue. Only lost window focus is logged; the app cannot detect AI help, another person or notes. A valid clinical IQ requires a qualified examiner.",
a_iq_d:"The general ability to reason, learn and solve novel problems; g accounts for a large share of the variance among cognitive tests (estimates vary by battery).",
a_chc_d:"A widely used scientific structure: a general factor g (in some versions) plus broad abilities (fluid, crystallized, visuospatial, working memory, speed, quantitative…), around ten.",
a_chc_m:"Several modern batteries are interpreted through CHC; the publisher says WJ V is aligned with CHC theory, and Wechsler scales are commonly mapped onto it. Interpret the profile, not just one number.",
a_ef_m:"Timed behavioural tasks (Stroop, flanker, Go/No-Go, delay discounting, BART) are the kind used here, but interference scores can be unreliable (published reliabilities for classic tasks range from 0 to .82), so repeat them and interpret with caution.",
a_cq_m:"Alternative Uses (AUT) scored by independent raters, the consensual assessment technique (Amabile) or the TTCT with trained scorers, plus documented creative achievements. Originality cannot be scored objectively by a simple offline program."},
fr:{
m_1:"Performance, pas opinion. L'auto-évaluation est la moins objective ; l'application n'utilise que des tâches de performance ou de comportement. La plupart ont une réponse clé, mais la créativité (AUT) repose sur votre propre étiquetage et l'évaluateur externe facultatif, et les visages sont des dessins schématiques non validés sur des normes de reconnaissance.",
m_2:"Les items sont générés par gabarits et la bonne réponse découle d'une règle, donc ils ne se répètent pas d'un essai à l'autre. L'équivalence des formes parallèles (même difficulté pour toutes les graines) n'a PAS été testée empiriquement.",
m_4:"Erreur de mesure. Tout score a une erreur standard. Le composite est ramené vers la moyenne selon la qualité avec laquelle les tests mesurent ensemble le facteur (r²), et un intervalle à 95 % est affiché ; il suppose des intercorrélations moyennes (0,40 QI ; 0,25 QE ; 0,15 exécutif ; 0,10 sens) que j'ai estimées, non mesurées.",
m_6:"Normes. Sans échantillon représentatif, pas de vrai QI. Les normes ici sont mes estimations et PROVISOIRES ; l'intervalle ajoute une erreur standard de 0,3 ET, supprimée après calibration avec 30 personnes ou plus.",
m_12:"Chronométrage et scores de différence. Le temps du navigateur et les périphériques ajoutent des dizaines de millisecondes d'erreur, et les scores de différence (interférence) sont moins fiables que les scores simples ; une étude publiée sur des tâches classiques a trouvé des fidélités test–retest de 0 à 0,82 (Hedge et al., 2018).",
m_lim:"Limites : auto-passation, latence et appareil variables, pratique, fatigue. Seule la perte de focus de la fenêtre est enregistrée ; l'application ne peut pas détecter l'aide d'une IA, d'une autre personne ou de notes. Un QI clinique valide exige un examinateur qualifié.",
a_iq_d:"La capacité générale de raisonner, d'apprendre et de résoudre des problèmes nouveaux ; g explique une grande part de la variance entre tests cognitifs (les estimations varient selon la batterie).",
a_chc_d:"Une structure scientifique largement utilisée : un facteur général g (dans certaines versions) plus des aptitudes larges (fluide, cristallisée, visuospatiale, mémoire de travail, vitesse, quantitative…), une dizaine.",
a_chc_m:"Plusieurs batteries modernes s'interprètent via CHC ; l'éditeur dit que le WJ V est aligné sur la théorie CHC, et les échelles de Wechsler y sont couramment rapportées. Interprétez le profil, pas un seul nombre.",
a_ef_m:"Des tâches comportementales chronométrées (Stroop, flanker, Go/No-Go, actualisation des délais, BART) sont du type utilisé ici, mais les scores d'interférence peuvent être peu fiables (fidélités publiées de 0 à 0,82 pour des tâches classiques) ; répétez-les et interprétez avec prudence.",
a_cq_m:"Usages alternatifs (AUT) cotés par des évaluateurs indépendants, technique d'évaluation consensuelle (Amabile) ou TTCT avec des correcteurs formés, plus des réalisations créatives documentées. L'originalité ne peut pas être cotée objectivement par un simple programme hors ligne."},
it:{
m_1:"Prestazione, non opinione. L'autovalutazione è la meno oggettiva; l'app usa solo compiti di prestazione o comportamento. Per la maggior parte c'è una risposta chiave, ma la creatività (AUT) si basa sulla tua etichettatura e sul valutatore esterno facoltativo, e i volti sono disegni schematici non validati su norme di riconoscimento.",
m_2:"Gli item sono generati da modelli e la risposta corretta deriva da una regola, quindi non si ripetono tra i tentativi. L'equivalenza delle forme parallele (stessa difficoltà per tutti i semi) NON è stata verificata empiricamente.",
m_4:"Errore di misura. Ogni punteggio ha un errore standard. Il composito è ridotto verso la media in proporzione a quanto bene i test misurano insieme il fattore (r²), ed è mostrato un intervallo al 95%; presuppone intercorrelazioni medie (0,40 QI; 0,25 QE; 0,15 esecutive; 0,10 sensi) stimate da me, non misurate.",
m_6:"Norme. Senza un campione rappresentativo non esiste un vero QI. Le norme qui sono mie stime e PROVVISORIE; l'intervallo aggiunge un errore standard di 0,3 DS, eliminato dopo la calibrazione con 30+ persone.",
m_12:"Cronometraggio e punteggi di differenza. Il tempo del browser e i dispositivi di input aggiungono decine di millisecondi di errore, e i punteggi di differenza (interferenza) sono meno affidabili dei punteggi semplici; uno studio pubblicato su compiti classici ha trovato affidabilità test–retest da 0 a 0,82 (Hedge e altri, 2018).",
m_lim:"Limiti: autosomministrazione, latenza e dispositivo variabili, pratica, fatica. Viene registrata solo la perdita di focus della finestra; l'app non può rilevare l'aiuto di una IA, di un'altra persona o di appunti. Un QI clinico valido richiede un esaminatore qualificato.",
a_iq_d:"La capacità generale di ragionare, imparare e risolvere problemi nuovi; g spiega una grande parte della varianza tra i test cognitivi (le stime variano per batteria).",
a_chc_d:"Una struttura scientifica molto usata: un fattore generale g (in alcune versioni) più abilità ampie (fluida, cristallizzata, visuospaziale, memoria di lavoro, velocità, quantitativa…), circa dieci.",
a_chc_m:"Diverse batterie moderne si interpretano tramite CHC; l'editore dice che il WJ V è allineato alla teoria CHC, e le scale Wechsler vi sono comunemente mappate. Interpreta il profilo, non un solo numero.",
a_ef_m:"Compiti comportamentali a tempo (Stroop, flanker, Go/No-Go, sconto del ritardo, BART) sono del tipo usato qui, ma i punteggi di interferenza possono essere inaffidabili (affidabilità pubblicate da 0 a 0,82 per compiti classici); ripetili e interpreta con cautela.",
a_cq_m:"Usi alternativi (AUT) valutati da giudici indipendenti, tecnica di valutazione consensuale (Amabile) o TTCT con valutatori formati, più realizzazioni creative documentate. L'originalità non può essere valutata oggettivamente da un semplice programma offline."},
es:{
m_1:"Rendimiento, no opinión. El autoinforme es lo menos objetivo; la aplicación solo usa tareas de rendimiento o conducta. La mayoría tiene una respuesta clave, pero la creatividad (AUT) depende de tu propio etiquetado y del evaluador externo opcional, y los rostros son dibujos esquemáticos no validados con normas de reconocimiento.",
m_2:"Los ítems se generan por plantillas y la respuesta correcta se deriva de una regla, por lo que no se repiten entre intentos. La equivalencia de formas paralelas (misma dificultad para todas las semillas) NO se ha probado empíricamente.",
m_4:"Error de medida. Toda puntuación tiene un error estándar. El compuesto se acerca a la media según lo bien que las pruebas midan juntas el factor (r²), y se muestra un intervalo del 95 %; supone intercorrelaciones medias (0,40 CI; 0,25 CE; 0,15 ejecutivas; 0,10 sentidos) estimadas por mí, no medidas.",
m_6:"Baremos. Sin una muestra representativa no hay un CI real. Los baremos aquí son mis estimaciones y PROVISIONALES; el intervalo suma un error estándar de 0,3 DE, que desaparece al calibrar con 30 o más personas.",
m_12:"Cronometraje y puntuaciones de diferencia. El tiempo del navegador y los dispositivos de entrada añaden decenas de milisegundos de error, y las puntuaciones de diferencia (interferencia) son menos fiables que las simples; un estudio publicado sobre tareas clásicas halló fiabilidades test–retest de 0 a 0,82 (Hedge y cols., 2018).",
m_lim:"Límites: autoadministración, latencia y dispositivo variables, práctica, fatiga. Solo se registra la pérdida de foco de la ventana; la aplicación no puede detectar ayuda de una IA, de otra persona o de apuntes. Un CI clínico válido exige un examinador cualificado.",
a_iq_d:"La capacidad general de razonar, aprender y resolver problemas nuevos; g explica una gran parte de la varianza entre pruebas cognitivas (las estimaciones varían según la batería).",
a_chc_d:"Una estructura científica muy usada: un factor general g (en algunas versiones) más aptitudes amplias (fluida, cristalizada, visoespacial, memoria de trabajo, velocidad, cuantitativa…), unas diez.",
a_chc_m:"Varias baterías modernas se interpretan mediante CHC; el editor dice que el WJ V está alineado con la teoría CHC, y las escalas Wechsler se asocian a menudo con ella. Interpreta el perfil, no solo un número.",
a_ef_m:"Tareas conductuales cronometradas (Stroop, flanker, Go/No-Go, descuento por demora, BART) son del tipo usado aquí, pero las puntuaciones de interferencia pueden ser poco fiables (fiabilidades publicadas de 0 a 0,82 en tareas clásicas); repítelas e interpreta con cautela.",
a_cq_m:"Usos alternativos (AUT) puntuados por evaluadores independientes, la técnica de evaluación consensuada (Amabile) o el TTCT con puntuadores entrenados, más logros creativos documentados. La originalidad no puede puntuarse objetivamente con un simple programa sin conexión."},
pt:{
m_1:"Desempenho, não opinião. O autorrelato é o menos objetivo; a aplicação só usa tarefas de desempenho ou comportamento. A maioria tem resposta-chave, mas a criatividade (AUT) depende da sua própria etiquetagem e do avaliador externo opcional, e os rostos são desenhos esquemáticos não validados em normas de reconhecimento.",
m_2:"Os itens são gerados por modelos e a resposta correta decorre de uma regra, por isso não se repetem entre tentativas. A equivalência de formas paralelas (mesma dificuldade para todas as sementes) NÃO foi testada empiricamente.",
m_4:"Erro de medida. Toda a pontuação tem um erro padrão. O compósito é puxado para a média consoante a qualidade com que os testes medem em conjunto o fator (r²), e é mostrado um intervalo de 95%; pressupõe intercorrelações médias (0,40 QI; 0,25 QE; 0,15 executivas; 0,10 sentidos) estimadas por mim, não medidas.",
m_6:"Normas. Sem amostra representativa não há QI real. As normas aqui são estimativas minhas e PROVISÓRIAS; o intervalo soma um erro padrão de 0,3 DP, eliminado após calibrar com 30 ou mais pessoas.",
m_12:"Cronometragem e pontuações de diferença. O tempo do navegador e os dispositivos de entrada acrescentam dezenas de milissegundos de erro, e as pontuações de diferença (interferência) são menos fiáveis do que as simples; um estudo publicado sobre tarefas clássicas encontrou fiabilidades teste–reteste de 0 a 0,82 (Hedge e col., 2018).",
m_lim:"Limites: autoadministração, latência e dispositivo variáveis, prática, fadiga. Só se regista a perda de foco da janela; a aplicação não deteta ajuda de uma IA, de outra pessoa ou de apontamentos. Um QI clínico válido exige um examinador qualificado.",
a_iq_d:"A capacidade geral de raciocinar, aprender e resolver problemas novos; g explica grande parte da variância entre testes cognitivos (as estimativas variam consoante a bateria).",
a_chc_d:"Uma estrutura científica muito usada: um fator geral g (em algumas versões) mais aptidões amplas (fluida, cristalizada, visuoespacial, memória de trabalho, velocidade, quantitativa…), cerca de dez.",
a_chc_m:"Várias baterias modernas interpretam-se através do CHC; o editor diz que o WJ V está alinhado com a teoria CHC, e as escalas Wechsler são frequentemente mapeadas nela. Interprete o perfil, não apenas um número.",
a_ef_m:"Tarefas comportamentais cronometradas (Stroop, flanker, Go/No-Go, desconto por atraso, BART) são do tipo usado aqui, mas as pontuações de interferência podem ser pouco fiáveis (fiabilidades publicadas de 0 a 0,82 em tarefas clássicas); repita-as e interprete com cautela.",
a_cq_m:"Usos alternativos (AUT) cotados por avaliadores independentes, técnica de avaliação consensual (Amabile) ou TTCT com cotadores treinados, mais realizações criativas documentadas. A originalidade não pode ser cotada objetivamente por um simples programa offline."},
de:{
m_1:"Leistung, nicht Meinung. Selbstbericht ist am wenigsten objektiv; die App nutzt nur Leistungs- oder Verhaltensaufgaben. Die meisten haben eine Schlüsselantwort, aber Kreativität (AUT) beruht auf deiner eigenen Etikettierung und dem optionalen externen Rater, und die Gesichter sind schematische Zeichnungen ohne Validierung an Erkennungsnormen.",
m_2:"Aufgaben werden prozedural aus Vorlagen erzeugt und die richtige Antwort folgt aus einer Regel, daher wiederholen sie sich nicht zwischen Versuchen. Die Äquivalenz paralleler Formen (gleiche Schwierigkeit über alle Seeds) wurde NICHT empirisch geprüft.",
m_4:"Messfehler. Jeder Wert hat einen Standardfehler. Das Komposit wird zur Mitte gezogen, je nachdem wie gut die Tests zusammen den Faktor messen (r²), und ein 95-%-Intervall wird gezeigt; es nimmt mittlere Interkorrelationen an (0,40 IQ; 0,25 EQ; 0,15 exekutiv; 0,10 Sinne), die ich geschätzt, nicht gemessen habe.",
m_6:"Normen. Ohne repräsentative Stichprobe gibt es keinen echten IQ. Die Normen hier sind meine Schätzungen und VORLÄUFIG; das Intervall addiert dafür einen Standardfehler von 0,3 SD, der nach Kalibrierung mit 30+ Personen entfällt.",
m_12:"Zeitmessung und Differenzwerte. Browser-Timing und Eingabegeräte fügen Dutzende Millisekunden Fehler hinzu, und Differenzwerte (Interferenz) sind weniger zuverlässig als einfache Werte; eine veröffentlichte Studie zu klassischen Aufgaben fand Test-Retest-Reliabilitäten von 0 bis 0,82 (Hedge et al., 2018).",
m_lim:"Grenzen: Selbstdurchführung, variable Latenz und Gerät, Übung, Müdigkeit. Nur der Fokusverlust des Fensters wird protokolliert; die App kann Hilfe durch KI, eine andere Person oder Notizen nicht erkennen. Ein gültiger klinischer IQ erfordert qualifizierte Testleitung.",
a_iq_d:"Die allgemeine Fähigkeit zu schlussfolgern, zu lernen und neue Probleme zu lösen; g erklärt einen großen Teil der Varianz zwischen kognitiven Tests (Schätzungen variieren je nach Batterie).",
a_chc_d:"Eine weit verbreitete wissenschaftliche Struktur: ein Generalfaktor g (in manchen Versionen) plus breite Fähigkeiten (fluide, kristallisierte, visuell-räumliche, Arbeitsgedächtnis, Tempo, quantitative…), etwa zehn.",
a_chc_m:"Mehrere moderne Batterien werden über CHC interpretiert; der Verlag sagt, WJ V sei an der CHC-Theorie ausgerichtet, und Wechsler-Skalen werden häufig darauf abgebildet. Deute das Profil, nicht nur eine Zahl.",
a_ef_m:"Zeitgesteuerte Verhaltensaufgaben (Stroop, Flanker, Go/No-Go, Verzögerungsdiskontierung, BART) sind von der hier genutzten Art, doch Interferenzwerte können unzuverlässig sein (veröffentlichte Reliabilitäten klassischer Aufgaben von 0 bis 0,82); wiederhole sie und deute vorsichtig.",
a_cq_m:"Alternative Verwendungen (AUT), bewertet von unabhängigen Ratern, die Consensual Assessment Technique (Amabile) oder der TTCT mit geschulten Auswertern, plus dokumentierte kreative Leistungen. Originalität lässt sich von einem einfachen Offline-Programm nicht objektiv bewerten."},
hu:{
m_1:"Teljesítmény, nem vélemény. Az önbeszámoló a legkevésbé objektív; az alkalmazás csak teljesítmény- vagy viselkedésfeladatokat használ. A többségnek van kulcsa, de a kreativitás (AUT) a te saját címkézésedre és az opcionális külső értékelőre épül, az arcok pedig sematikus rajzok, felismerési normákon nem validálva.",
m_2:"A tételeket sablonokból generáljuk, és a helyes válasz egy szabályból következik, így a próbák között nem ismétlődnek. A párhuzamos formák egyenértékűségét (azonos nehézség minden magértéken) NEM vizsgáltuk empirikusan.",
m_4:"Mérési hiba. Minden pontszámnak van standard hibája. Az összetett mutatót az átlag felé húzzuk aszerint, hogy a tesztek együtt mennyire jól mérik a faktort (r²), és 95%-os intervallumot mutatunk; átlagos interkorrelációkat feltételez (0,40 IQ; 0,25 EQ; 0,15 végrehajtó; 0,10 érzékek), amelyeket én becsültem, nem mértem.",
m_6:"Normák. Reprezentatív minta nélkül nincs valódi IQ. A normák itt az én becsléseim és ELŐZETESEK; az intervallum 0,3 SD standard hibát ad hozzá, amely 30+ fővel végzett kalibráció után megszűnik.",
m_12:"Időzítés és különbségi pontszámok. A böngésző időzítése és a beviteli eszközök tíz-húsz ezredmásodperces hibát adnak, a különbségi pontszámok (interferencia) pedig kevésbé megbízhatók az egyszerűeknél; egy publikált, klasszikus feladatokat vizsgáló tanulmány 0 és 0,82 közötti teszt–reteszt megbízhatóságot talált (Hedge és mtsai., 2018).",
m_lim:"Korlátok: önállóan végzett felvétel, változó késleltetés és eszköz, gyakorlás, fáradtság. Csak az ablak fókuszvesztését naplózzuk; az alkalmazás nem ismeri fel az MI, más személy vagy jegyzetek segítségét. Az érvényes klinikai IQ képzett vizsgáztatót igényel.",
a_iq_d:"Az általános képesség az érvelésre, tanulásra és új problémák megoldására; a g a kognitív tesztek közti variancia nagy részét magyarázza (a becslések tesztenként eltérnek).",
a_chc_d:"Széles körben használt tudományos szerkezet: egy általános g faktor (egyes változatokban) plusz tágabb képességek (fluid, kristályosodott, vizuális-téri, munkamemória, sebesség, mennyiségi…), nagyjából tíz.",
a_chc_m:"Több modern tesztbatériát a CHC-n keresztül értelmeznek; a kiadó szerint a WJ V a CHC-elmélethez igazodik, a Wechsler-skálákat pedig gyakran leképezik rá. A profilt értelmezd, ne csak egyetlen számot.",
a_ef_m:"Időzített viselkedési feladatok (Stroop, flanker, Go/No-Go, késleltetett diszkontálás, BART) a itt használt fajtához tartoznak, de az interferenciapontok megbízhatatlanok lehetnek (klasszikus feladatokra publikált megbízhatóság 0 és 0,82 között); ismételd őket, és óvatosan értelmezd.",
a_cq_m:"Alternatív felhasználások (AUT) független értékelők által pontozva, a konszenzusos értékelési technika (Amabile) vagy a TTCT képzett pontozókkal, plusz dokumentált kreatív teljesítmények. Az eredetiséget egy egyszerű offline program nem tudja objektíven pontozni."}

pt:{aria_lang:"Idioma",aria_stats:"Números da app",g_answer:"Resposta",aria_theme:"Tema",g_option:"Opção",g_left:"esquerda",g_right:"direita",r_short:"o percurso adaptativo não atingiu 6 inversões: resultado pouco fiável",

function matrixItem(r,lv){
 const A=["shape","shade","size","count"];
 const nvar=lv<2?1:lv<5?2:3;
 const varying=shuffle(r,A).slice(0,nvar);
 const pool=lv<2?["col","row"]:lv<5?["col","row","latin"]:["latin","latin2","col","row"];
 const rule={},perm={},cons={};
 varying.forEach((a,j)=>{rule[a]=(lv>=5&&j===0)?pick(r,["latin","latin2"]):pick(r,pool);perm[a]=shuffle(r,[0,1,2])});
 A.forEach(a=>{if(!varying.includes(a))cons[a]=ri(r,0,2)});
 const f={col:(R,C)=>C,row:(R,C)=>R,latin:(R,C)=>(R+C)%3,latin2:(R,C)=>(R+2*C)%3};
 const cell=(R,C)=>{const o={};A.forEach(a=>{o[a]=varying.includes(a)?perm[a][f[rule[a]](R,C)]:cons[a]});return o};
 const correct=cell(2,2);const seen=new Set([JSON.stringify(correct)]);const dis=[];
 const variants=[];

 shuffle(r,variants).forEach(o=>{const k=JSON.stringify(o);if(!seen.has(k)&&dis.length<5){seen.add(k);dis.push(o)}});
 const second=shuffle(r,A);for(let g=0;dis.length<5&&g<40;g++){const o=Object.assign({},correct);const a=second[g%4],b=second[(g+1)%4];o[a]=(o[a]+1+ri(r,0,1))%3;o[b]=(o[b]+1)%3;const k=JSON.stringify(o);if(!seen.has(k)){seen.add(k);dis.push(o)}}
 const opts=shuffle(r,[correct,...dis]);
 return{render:q=>{const g=el("div",{class:"mat"});for(let R=0;R<3;R++)for(let C=0;C<3;C++)g.append(el("div",R===2&&C===2?{}:{html:cellSVG(cell(R,C))},R===2&&C===2?"?":null));q.append(g)},

}

const pnorm=cs=>{const mx=Math.min(...cs.map(c=>c[0])),my=Math.min(...cs.map(c=>c[1]));return cs.map(c=>[c[0]-mx,c[1]-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const pkey=cs=>pnorm(cs).map(c=>c.join(",")).join(";");
const prot=cs=>cs.map(([x,y])=>[3-y,x]);
const pmir=cs=>cs.map(([x,y])=>[3-x,y]);
const polySVG=cs=>{const n=pnorm(cs);return`<svg class="poly" viewBox="0 0 40 40">${n.map(([x,y])=>`<rect x="${x*10+.8}" y="${y*10+.8}" width="8.4" height="8.4" fill="currentColor" rx="1"/>`).join("")}</svg>`};
function genPoly(r,n){const cs=[[ri(r,0,3),ri(r,0,3)]];let g=0;while(cs.length<n&&g++<500){const[x,y]=pick(r,cs);const d=pick(r,[[1,0],[-1,0],[0,1],[0,-1]]);const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>3||ny>3)continue;if(cs.some(c=>c[0]===nx&&c[1]===ny))continue;cs.push([nx,ny])}return cs}
function rotItem(r,i){
 const n=5+Math.floor(i/2);
 for(let tries=0;tries<400;tries++){
  const P=genPoly(r,n);if(P.length<n)continue;
  const rots=[P];for(let k=1;k<4;k++)rots.push(prot(rots[k-1]));
  const keys=rots.map(pkey);const M=pmir(P);
  const mrots=[M];for(let k=1;k<4;k++)mrots.push(prot(mrots[k-1]));
  const mk=mrots.map(pkey);
  if(mk.some(k=>keys.includes(k)))continue;
  if(new Set(mk).size<3)continue;
  const kk=[1,2,3].filter(k=>keys[k]!==keys[0]);if(!kk.length)continue;
  const correct=rots[pick(r,kk)];
  const uniq=[];const seen=new Set();mrots.forEach(m=>{const k=pkey(m);if(!seen.has(k)){seen.add(k);uniq.push(m)}});
  const dis=shuffle(r,uniq).slice(0,3);
  const opts=shuffle(r,[correct,...dis]);
  return{render:q=>q.append(el("span",{html:polySVG(P)})),options:opts.map(o=>el("span",{html:polySVG(o)})),correct:opts.indexOf(correct)};
 }
 throw new Error("poly");
}

function runMCQ(box,items,{limit=0,alive=()=>true}={}){

  let i=0,correct=0,tm;const rts=[];
  const head=el("div",{class:"prog"}),bar=el("div",{class:"tbar"},el("i")),q=el("div",{class:"q"}),opts=el("div",{class:"opts"});
  box.replaceChildren(head,limit?bar:"",q,opts);let t0=0;
  function show(){
   if(!alive())return;
   if(i>=items.length){res({correct,n:items.length,rts});return}
   const it=items[i];head.textContent=`${i+1} / ${items.length}`;
   q.replaceChildren();it.render(q);opts.replaceChildren();
   it.options.forEach((o,k)=>{const at={class:"opt",onclick:()=>pickA(k)};if(it.labels)at["aria-label"]=it.labels[k];else if(typeof o!=="string")at["aria-label"]=t("g_option")+" "+(k+1);opts.append(el("button",at,o))});
   t0=performance.now();clearTimeout(tm);
   if(limit){const b=bar.firstChild;b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=`width ${limit}s linear`;b.style.width="0";tm=setTimeout(()=>pickA(-1),limit*1000)}
  }
  function pickA(k){if(!alive()){clearTimeout(tm);return}clearTimeout(tm);rts.push(performance.now()-t0);if(k===items[i].correct)correct++;i++;show()}
  show();
 });
}
